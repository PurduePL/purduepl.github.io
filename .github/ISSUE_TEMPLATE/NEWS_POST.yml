name: News Post
description: A news post to be put on the website
title: "News: "
labels: [news]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: Headline shown on the website.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Content
      description: Links can be in either markdown or html style.
    validations:
      required: true
