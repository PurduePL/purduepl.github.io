# https://clementbm.github.io/coding/2020/05/31/automatically-validate-links-on-jekyll-website.html
name: CheckLinks
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checklinks:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build site and check for broken links
        run: ./check