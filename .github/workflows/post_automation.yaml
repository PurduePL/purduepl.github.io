name: Post Automation
on:
    issues:
        types:
            - opened
            - edited

permissions:
    contents: write
    pull-requests: write
    issues: read

jobs:
    issue_to_pr:
        runs-on: ubuntu-latest
        if: contains(github.event.issue.labels.*.name, 'news') || contains(github.event.issue.labels.*.name, 'member')
        defaults:
            run:
                working-directory: ./collections
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                enable-cache: true
                cache-dependency-glob: collections/uv.lock

            - run: |
                git config user.name "github-actions[bot]"
                git config user.email ""

            - name: Create PR for news post
              if: contains(github.event.issue.labels.*.name, 'news')
              run: uv run python generate_post_from_issue.py ${{ github.event.issue.number }}

            - name: Create PR for member addition
              if: contains(github.event.issue.labels.*.name, 'member')
              run: uv run python generate_member_from_issue.py ${{ github.event.issue.number }}
